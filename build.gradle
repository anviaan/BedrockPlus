plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.99' apply false
}

tasks.register("printEnv") {
    doLast {
        def envFile = new File(System.getenv("GITHUB_ENV"))
        envFile.append("MOD_VERSION=${project.version}\n")
        envFile.append("RELEASE_NAME=${project.mod_name}-${project.version}\n")
        envFile.append("GAME_VERSIONS=${project.minecraft_version_range}\n")
    }
}

//Solve the issue with lwjgl-freetype on macOS
subprojects {
    repositories {
        maven {
            url "https://libraries.minecraft.net"
            content { includeModule("org.lwjgl", "lwjgl-freetype") }
        }
    }
}